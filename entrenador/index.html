<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenador SAD</title><style>
:root{--ink:#173042;--muted:#5f7480;--paper:#f7f5ef;--panel:#fffdf8;--accent:#d46643;--ok:#237a57;--bad:#b34343}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#dbe9e5,transparent 34%),var(--paper);font:17px/1.5 system-ui,sans-serif;color:var(--ink)}main{max-width:840px;margin:0 auto;padding:42px 22px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #ccd6d2;padding-bottom:24px;margin-bottom:28px}h1{font-size:clamp(2rem,7vw,4rem);line-height:.95;margin:0;letter-spacing:-.06em}.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}button{font:inherit;border:0;border-radius:12px;padding:13px 18px;background:var(--ink);color:white;font-weight:700;cursor:pointer}button:hover{transform:translateY(-1px)}button.secondary{background:#e7ece8;color:var(--ink)}.panel{background:var(--panel);border:1px solid #dce4df;border-radius:20px;padding:28px;box-shadow:0 12px 36px #18304012}.modes{display:flex;gap:10px;flex-wrap:wrap}.question-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}.category{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.options{display:grid;gap:10px;margin-top:24px}.option{background:white;border:1px solid #d4dfda;color:var(--ink);text-align:left}.option:hover{border-color:var(--accent)}.option.selected{outline:3px solid #e9b6a5}.feedback{margin-top:24px;padding:17px;border-radius:12px}.feedback.ok{background:#e4f3eb;color:var(--ok)}.feedback.bad{background:#fae8e7;color:var(--bad)}.hidden{display:none}.score{font-size:2.8rem;font-weight:900;letter-spacing:-.06em}.note{color:var(--muted)}#next{margin-top:16px;background:var(--accent)}@media(max-width:550px){header{display:block}header p{margin-top:16px}.panel{padding:21px}}
</style></head><body><main><header><div><div class="eyebrow">Seguridad y Alta Disponibilidad</div><h1>Entrenador<br>SAD</h1></div><p class="note">Tu progreso se guarda localmente<br>para revisarlo juntos.</p></header><section id="start" class="panel"><h2>Elige tu ronda</h2><p>Empieza con 10. Cada respuesta se guarda en el contenedor y se corrige al instante.</p><div class="modes"><button onclick="newRound(10)">Ronda de 10</button><button onclick="newRound(20)">Ronda de 20</button><button class="secondary" onclick="newRound(30)">Simulacro disponible: 30</button></div></section><section id="quiz" class="panel hidden"><div class="question-meta"><span id="progress"></span><span id="category" class="category"></span></div><h2 id="question"></h2><div id="options" class="options"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="hidden" onclick="nextQuestion()">Siguiente pregunta</button></section><section id="summary" class="panel hidden"><div class="eyebrow">Ronda completada</div><div id="score" class="score"></div><p id="summaryText"></p><button onclick="newRound(10)">Otra ronda de 10</button> <button class="secondary" onclick="location.reload()">Ver progreso</button></section></main><script>
let data,current=0,locked=false;
async function api(url,body){return fetch(url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(r=>r.json())}
async function load(){data=await api('/api/state');if(!data.state.round.length){show('start');return}current=data.answered;if(data.state.finished){renderSummary();return}show('quiz');renderQuestion()}
function show(id){['start','quiz','summary'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
async function newRound(size){await api('/api/new-round',{size});await load()}
function renderQuestion(){locked=false;let q=data.questions[current];document.getElementById('progress').textContent=`Pregunta ${current+1} de ${data.questions.length}`;document.getElementById('category').textContent=q.category;document.getElementById('question').textContent=q.text;let box=document.getElementById('options');box.innerHTML='';q.options.forEach((text,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+text;b.onclick=()=>answer(i,b);box.appendChild(b)});document.getElementById('feedback').className='feedback hidden';document.getElementById('next').classList.add('hidden')}
async function answer(selected,button){if(locked)return;locked=true;document.querySelectorAll('.option').forEach(x=>x.disabled=true);button.classList.add('selected');let r=await api('/api/answer',{position:current,selected});let f=document.getElementById('feedback');f.className='feedback '+(r.correct?'ok':'bad');f.innerHTML=`<strong>${r.correct?'Correcto.':'No exactamente.'}</strong> ${r.explanation}`;let n=document.getElementById('next');n.textContent=r.finished?'Ver resultado':'Siguiente pregunta';n.classList.remove('hidden')}
async function nextQuestion(){data=await api('/api/state');current=data.answered;if(data.state.finished)renderSummary();else renderQuestion()}
function renderSummary(){show('summary');let correct=data.state.answers.filter(a=>a.correct).length,total=data.state.answers.length;document.getElementById('score').textContent=`${correct} / ${total}`;document.getElementById('summaryText').textContent=correct===total?'Perfecto: ronda limpia. Dime que la revise y subimos dificultad.':`Has fallado ${total-correct}. Dime “revísame la ronda” y usaré el progreso guardado para explicarte los fallos.`}
load();
</script><script>
const examButton = document.querySelector('.modes .secondary');
examButton.textContent = 'Simulacro de 60';
examButton.setAttribute('onclick', 'newRound(60)');
function addSummaryRounds(){
  const summary = document.getElementById('summary');
  if (!summary || summary.querySelector('[data-rounds]')) return;
  const group = document.createElement('div');
  group.dataset.rounds = 'true';
  group.className = 'modes';
  group.style.marginTop = '12px';
  group.innerHTML = '<button class="secondary" onclick="newRound(20)">Nueva ronda de 20</button><button class="secondary" onclick="newRound(60)">Simulacro de 60</button>';
  summary.appendChild(group);
}
setInterval(addSummaryRounds, 300);
</script></body></html>
