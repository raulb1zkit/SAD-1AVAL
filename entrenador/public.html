<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenador SAD</title><style>
:root{--ink:#173042;--muted:#5f7480;--paper:#f7f5ef;--panel:#fffdf8;--accent:#d46643;--ok:#237a57;--bad:#b34343}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#dbe9e5,transparent 34%),var(--paper);font:17px/1.5 system-ui,sans-serif;color:var(--ink)}main{max-width:840px;margin:auto;padding:42px 22px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #ccd6d2;padding-bottom:24px;margin-bottom:28px}h1{font-size:clamp(2rem,7vw,4rem);line-height:.95;margin:0;letter-spacing:-.06em}.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}button{font:inherit;border:0;border-radius:12px;padding:13px 18px;background:var(--ink);color:white;font-weight:700;cursor:pointer}.secondary{background:#e7ece8;color:var(--ink)}.panel{background:var(--panel);border:1px solid #dce4df;border-radius:20px;padding:28px;box-shadow:0 12px 36px #18304012}.modes,.options{display:grid;gap:10px}.modes{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.option{background:white;border:1px solid #d4dfda;color:var(--ink);text-align:left}.option.selected{outline:3px solid #e9b6a5}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}.category{color:var(--accent);font-weight:800;text-transform:uppercase}.feedback{margin-top:24px;padding:17px;border-radius:12px}.ok{background:#e4f3eb;color:var(--ok)}.bad{background:#fae8e7;color:var(--bad)}.hidden{display:none}.score{font-size:2.8rem;font-weight:900}.note{color:var(--muted)}#next{margin-top:16px;background:var(--accent)}@media(max-width:550px){header{display:block}.panel{padding:21px}}
</style></head><body><main><header><div><div class="eyebrow">Seguridad y Alta Disponibilidad</div><h1>Entrenador<br>SAD</h1></div><p class="note">Tus resultados se guardan<br>solo en este navegador.</p></header><section id="start" class="panel"><h2>Elige tu ronda</h2><p>Corrección inmediata y progreso privado en tu dispositivo.</p><div class="modes"><button onclick="newRound(10,false)">Teoría: 10</button><button onclick="newRound(20,false)">Teoría: 20</button><button class="secondary" onclick="newRound(60,true)">Simulacro: 60</button></div></section><section id="quiz" class="panel hidden"><div class="meta"><span id="progress"></span><span id="category" class="category"></span></div><h2 id="question"></h2><div id="options" class="options"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="hidden" onclick="next()">Siguiente</button></section><section id="summary" class="panel hidden"><div class="eyebrow">Ronda completada</div><div id="score" class="score"></div><p id="text"></p><div class="modes"><button onclick="newRound(20,false)">Otra de teoría</button><button class="secondary" onclick="newRound(60,true)">Simulacro completo</button></div></section></main><script>
const KEY='sad-entrenador-v1';let bank=[],state={round:[],answers:[]},pos=0,locked=false;const SECTIONS={fundamentos:['fundamentos','pilares','riesgo','vulnerabilidades','auditoria'],amenazas:['malware','fisica','continuidad','copias','forense','raid'],cripto:['cripto','acceso','biometria','credenciales','certificados','publicas','correo'],ataques:['ataques','redes','web'],wifi:['wifi','monitorizacion'],wireshark:['display','captura']};const el=id=>document.getElementById(id);const show=id=>['start','quiz','summary'].forEach(x=>el(x).classList.toggle('hidden',x!==id));
fetch('questions.json').then(r=>r.json()).then(q=>{bank=q;state=JSON.parse(localStorage.getItem(KEY)||'{"round":[],"answers":[]}');if(state.round.length&&state.answers.length<state.round.length){pos=state.answers.length;show('quiz');render()}else if(state.round.length){summary()}else show('start')});
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function newRound(n,all,section=null){let pool=bank.filter(q=>section?SECTIONS[section].includes(q.category):(all||!['display','captura'].includes(q.category)));pool.sort(()=>Math.random()-.5);state={round:pool.slice(0,n).map(q=>q.id),answers:[]};pos=0;save();show('quiz');render()}
function render(){locked=false;let q=bank[state.round[pos]];el('progress').textContent=`Pregunta ${pos+1} de ${state.round.length}`;el('category').textContent=q.category;el('question').textContent=q.text;el('options').innerHTML='';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>answer(i,b);el('options').appendChild(b)});el('feedback').className='feedback hidden';el('next').classList.add('hidden')}
function answer(choice,button){if(locked)return;locked=true;document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('selected');let q=bank[state.round[pos]],ok=choice===q.answer;state.answers.push({id:q.id,choice,ok});save();el('feedback').className='feedback '+(ok?'ok':'bad');el('feedback').innerHTML=`<strong>${ok?'Correcto.':'No exactamente.'}</strong> ${q.explanation}`;el('next').textContent=pos+1===state.round.length?'Ver resultado':'Siguiente';el('next').classList.remove('hidden')}
function next(){pos++;if(pos===state.round.length)summary();else render()}function summary(){show('summary');let hit=state.answers.filter(a=>a.ok).length;el('score').textContent=`${hit} / ${state.answers.length}`;el('text').textContent=hit===state.answers.length?'Perfecto: ronda limpia.':'Repasa las explicaciones de los fallos y vuelve a intentarlo.'}
const sectionPanel=document.createElement('div');sectionPanel.style.marginTop='22px';sectionPanel.innerHTML='<div class="eyebrow">Test por apartado</div><p>Elige un bloque y practica solo ese contenido.</p><div class="modes"><select id="section" aria-label="Apartado"><option value="fundamentos">Fundamentos y riesgo</option><option value="amenazas">Amenazas, continuidad y RAID</option><option value="cripto">Criptografía, credenciales y certificados</option><option value="ataques">Ataques, red y web</option><option value="wifi">Wi-Fi y monitorización</option><option value="wireshark">Wireshark</option></select><button onclick="sectionRound(10)">10 del apartado</button><button class="secondary" onclick="sectionRound(20)">20 del apartado</button></div>';el('start').appendChild(sectionPanel);function sectionRound(n){newRound(n,false,el('section').value)}const sectionRestart=document.createElement('button');sectionRestart.className='secondary';sectionRestart.textContent='Elegir apartado';sectionRestart.onclick=()=>show('start');el('summary').querySelector('.modes').appendChild(sectionRestart);
</script></body></html>
