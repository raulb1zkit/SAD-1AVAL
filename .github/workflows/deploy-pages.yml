name: Publicar vault en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Descargar Quartz
        run: git clone --depth 1 https://github.com/jackyzha0/quartz.git /tmp/quartz

      - name: Preparar el contenido del sitio
        run: |
          rm -rf /tmp/quartz/content
          mkdir -p /tmp/quartz/content
          cp -a site/content/. /tmp/quartz/content/
          mkdir -p /tmp/quartz/content/apuntes /tmp/quartz/content/docs
          cp -a apuntes/. /tmp/quartz/content/apuntes/
          cp -a docs/. /tmp/quartz/content/docs/
          mkdir -p /tmp/quartz/content/entrenador
          cp entrenador/public.html /tmp/quartz/content/entrenador/index.html
          python3 entrenador/build_static.py --output /tmp/quartz/content/entrenador/questions.json
          cp -a site/quartz.ts /tmp/quartz/quartz.ts

      - name: Instalar dependencias de Quartz
        working-directory: /tmp/quartz
        run: |
          npm ci
          npx quartz plugin install

      - name: Generar el sitio
        working-directory: /tmp/quartz
        run: npx quartz build

      - name: Subir el sitio generado
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
